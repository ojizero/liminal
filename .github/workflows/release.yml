name: Release

on:
  push:
    branches: [main]

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.19.5"
  OTP_VERSION: "28.5"
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/liminal
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  version-check:
    name: Version Check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      needs_release: ${{ steps.check.outputs.needs_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release requirements
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current=$(grep 'version:' mix.exs | head -1 | sed 's/.*"\(.*\)".*/\1/')
          latest_tag=$(gh release view --json tagName -q '.tagName' 2>/dev/null || echo "")
          released=${latest_tag#v}

          if [[ -n "$latest_tag" ]]; then
            range="${latest_tag}..HEAD"
          else
            range="$(git hash-object -t tree /dev/null)..HEAD"
          fi

          echo "Current version:  $current"
          echo "Released version: ${released:-<none>}"
          echo "Diff range:       $range"

          needs_release=false

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue

            case "$file" in
              .github/*|.agents/*|.claude/*|test/*|README.md|AGENTS.md|CLAUDE.md|.gitignore|.dockerignore|LICENSE*)
                ;;
              *)
                needs_release=true
                break
                ;;
            esac
          done < <(git diff --name-only "$range")

          if [[ "$needs_release" == true ]]; then
            echo "Releasable changes detected since ${latest_tag:-initial commit}."
            echo "needs_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$current" >> "$GITHUB_OUTPUT"

            if [[ -n "$released" && "$current" = "$released" ]]; then
              echo "::error::Version $current already released. Bump the version in mix.exs before merging releasable changes."
              exit 1
            fi
          else
            echo "Only non-releasable changes detected (CI, tests, docs, etc.). Skipping release."
            echo "needs_release=false" >> "$GITHUB_OUTPUT"
            echo "version=$current" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test & Lint
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test

  docker:
    name: Build & Push Docker
    needs: [version-check, test]
    if: needs.version-check.outputs.needs_release == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      actions: write
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ needs.version-check.outputs.version }}
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ needs.version-check.outputs.version }}
            ${{ env.GHCR_IMAGE }}:latest
          cache-from: |
            type=gha,scope=liminal
            type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache
          cache-to: |
            type=gha,mode=max,scope=liminal
            type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache,mode=max

  release:
    name: GitHub Release
    needs: [version-check, docker]
    if: needs.version-check.outputs.needs_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes
