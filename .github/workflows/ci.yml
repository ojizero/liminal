name: CI

on:
  pull_request:
    branches: [main]

env:
  MIX_ENV: test

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect VERSION changes
        id: detect
        env:
          BEFORE: ${{ github.event.pull_request.base.sha }}
          AFTER: ${{ github.sha }}
        run: mise run ci:detect-version-change

  version-check:
    name: Version Check
    needs: changes
    if: needs.changes.outputs.version == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify VERSION matches latest release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run ci:verify-version

      - name: Verify release commits follow Conventional Commits
        run: mise run ci:verify-commits

  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ hashFiles('.mise.toml', 'mix.lock') }}
          restore-keys: |
            mix-

      - name: Run CI checks
        run: mise run ci
