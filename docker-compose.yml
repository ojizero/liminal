services:
  liminal:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Compile-time directory for downloaded link preview images (see README).
        ASSETS_DIR: /data/assets
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    volumes:
      - liminal_data:/data
    environment:
      - PUID=${PUID:-911}
      - PGID=${PGID:-911}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - DATABASE_PATH=${DATABASE_PATH:-/data/liminal.db}
      - PHX_SERVER=true
      - PHX_HOST=${PHX_HOST:-localhost}
      - PHX_CHECK_ORIGINS
      - PORT=${PORT:-4000}
      - POOL_SIZE=${POOL_SIZE:-5}
      - SIGNUPS_ENABLED=${SIGNUPS_ENABLED:-false}
      - AUTO_MIGRATE=${AUTO_MIGRATE:-true}
      - LOG_LEVEL=${LOG_LEVEL:-warning}
      - DNS_CLUSTER_QUERY
    restart: unless-stopped

volumes:
  liminal_data:
    driver: local
