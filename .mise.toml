[settings]
experimental = true

[tools]
erlang = "28.5"
elixir = "1.19.5-otp-28"
gh = "2.93.0"

# Git hook setup runs idempotently via setup:git-hooks.
# enter: enforced on every project entry (mise activate required).
# postinstall: covers fresh clones that run mise install before cd.
[hooks]
enter = { task = "setup:git-hooks" }
postinstall = { task = "setup:git-hooks" }

[tasks."ci:deps"]
description = "Install Mix dependencies for CI"
env = { MIX_ENV = "test" }
run = "mix deps.get"

[tasks."ci:format"]
description = "Check Elixir formatting"
env = { MIX_ENV = "test" }
run = "mix format --check-formatted"

[tasks."ci:compile"]
description = "Compile with warnings as errors"
env = { MIX_ENV = "test" }
run = "mix compile --warnings-as-errors"

[tasks."ci:test"]
description = "Run the test suite"
env = { MIX_ENV = "test" }
run = "mix test"

[tasks.ci]
description = "Run CI test and lint checks"
run = [
  { task = "ci:deps" },
  { task = "ci:format" },
  { task = "ci:compile" },
  { task = "ci:test" },
]
